name: Notion Task → Done on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  update-notion-status:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/notion-')
    runs-on: ubuntu-latest
    steps:
      - name: Extract Notion Page ID from branch name
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          PAGE_ID=$(echo "$BRANCH" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
          if [ -z "$PAGE_ID" ]; then
            echo "브랜치명에서 Notion Page ID를 찾지 못함: $BRANCH"
            exit 1
          fi
          echo "page_id=$PAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Update Notion task status to Done
        run: |
          curl -s -X PATCH "https://api.notion.com/v1/pages/${{ steps.extract.outputs.page_id }}" \
            -H "Authorization: Bearer ${{ secrets.NOTION_API_KEY }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"Status": {"status": {"name": "Done"}}}}'
