name: Android APK

on:
  push:
    branches: [main]
    # 모바일과 무관한 변경(백엔드만 고친 머지 등)에서는 돌리지 않는다.
    # APK 빌드는 10분 안팎이라 매 머지마다 돌리면 Actions 분이 아깝다.
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

# 연속 머지 시 이전 빌드를 취소한다. 어차피 최신 APK만 쓴다.
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # 릴리스 생성/갱신에 필요

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # 배포 키가 Secrets에 있으면 그걸로 서명하고, 없으면 debug 키로 떨어진다.
      # debug 키로 서명해도 설치는 되고, debug.keystore가 레포에 있어 누가 빌드하든
      # 같은 키라서 업데이트 설치도 된다. 내부 테스트에는 충분하다.
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64가 없어 debug 키로 서명합니다. 스토어 배포에는 쓸 수 없습니다."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/planit-release.keystore"
          echo "signed=release" >> "$GITHUB_OUTPUT"

      # apps/mobile/.env는 gitignore라 CI에는 없다. 없으면 config/env.ts의 폴백
      # http://localhost:3000 이 번들에 박히는데, 폰에서 localhost는 폰 자신이라
      # 서버에 닿지 않는다(실제로 그렇게 배포됐다).
      #
      # API_BASE_URL은 공개된 배포 주소라 시크릿이 아니다. 여기 그대로 둔다.
      # KAKAO_JS_KEY는 시크릿이므로 있으면 채우고 없으면 빈 값으로 둔다
      # (지도 임베드를 아직 쓰지 않아 빈 값이어도 앱은 동작한다).
      - name: Write .env
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        working-directory: apps/mobile
        run: |
          cat > .env <<EOF
          API_BASE_URL=https://planit-backend-omega.vercel.app
          KAKAO_JS_KEY=$KAKAO_JS_KEY
          EOF
          echo "API_BASE_URL=$(grep '^API_BASE_URL=' .env | cut -d= -f2-)"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: |
          # ABI를 arm64-v8a 하나로 좁힌다.
          #
          # 기본값은 armeabi-v7a,arm64-v8a,x86,x86_64 넷인데, 새 아키텍처라
          # ABI마다 C++ 코드젠과 네이티브 컴파일이 따로 돌아 시간이 거의 4배가 된다
          # (첫 실행 실측 22.6분). x86/x86_64는 에뮬레이터 전용이라 배포 APK에
          # 필요 없고, armeabi-v7a는 32비트 구형 기기용이다.
          # 실기기는 2017년 이후 사실상 전부 arm64-v8a다.
          #
          # 에뮬레이터에 설치해야 하면 로컬에서 빌드하거나
          # -PreactNativeArchitectures=x86_64 로 따로 만들면 된다.
          ARGS="-PreactNativeArchitectures=arm64-v8a"
          ARGS="$ARGS -PplanitVersionCode=${{ github.run_number }} -PplanitVersionName=0.1.0-${GITHUB_SHA::7}"
          if [ "${{ steps.keystore.outputs.signed }}" = "release" ]; then
            ARGS="$ARGS -PPLANIT_KEYSTORE_FILE=$RUNNER_TEMP/planit-release.keystore"
            ARGS="$ARGS -PPLANIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            ARGS="$ARGS -PPLANIT_KEY_ALIAS=$KEY_ALIAS -PPLANIT_KEY_PASSWORD=$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease $ARGS --console=plain

      - name: Rename APK
        id: apk
        run: |
          # 파일명에 커밋 sha를 넣지 않는다.
          #
          # sha를 넣으면 빌드마다 새 파일이 되어 릴리스에 계속 쌓이고(--clobber는
          # 같은 이름만 덮어쓴다), 받는 사람은 어느 게 최신인지 알 수 없다.
          # 이름을 고정하면 덮어써지고 다운로드 링크도 변하지 않아 공유하기 좋다.
          # 어느 커밋인지는 릴리스 본문에 적는다.
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          DEST="planit-android.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$DEST" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 태그마다 릴리스를 새로 만들지 않고 하나를 갱신한다.
      # 목적이 "동료에게 최신 테스트 APK 주기"라서 링크가 고정되는 편이 낫다.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=$(cat <<EOF
          최신 안드로이드 테스트 빌드입니다. 아래 \`.apk\`를 받아 설치하세요.

          | | |
          |---|---|
          | 커밋 | \`${GITHUB_SHA::7}\` |
          | versionCode | \`${{ github.run_number }}\` |
          | 크기 | ${{ steps.apk.outputs.size }} |
          | 서명 | \`${{ steps.keystore.outputs.signed }}\` |
          | ABI | \`arm64-v8a\` (실기기용) |
          | 서버 | \`planit-backend-omega.vercel.app\` |

          설치하려면 기기에서 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.
          Metro 없이 단독 실행되며 배포된 백엔드에 붙습니다.
          arm64-v8a 전용이라 x86 에뮬레이터에는 설치되지 않습니다.
          EOF
          )
          if [ "${{ steps.keystore.outputs.signed }}" = "debug" ]; then
            NOTE="$NOTE

          > 경고: 배포 키가 없어 **debug 키로 서명**된 빌드입니다. 내부 테스트용이며 스토어에 올릴 수 없습니다."
          fi

          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTE"
            gh release upload android-latest "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create android-latest "${{ steps.apk.outputs.path }}" \
              --title "Android 테스트 빌드" --notes "$NOTE" --prerelease
          fi
