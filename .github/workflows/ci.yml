name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 연속 push하면 이전 실행을 취소해 CI 시간을 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          # Vercel이 백엔드를 24.x로 돌린다(프로젝트 설정 nodeVersion).
          # CI는 운영과 같은 버전에서 테스트해야 한다.
          # 20에서는 @supabase/supabase-js가 지원 중단 경고를 냈다(>= 22 요구).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 로컬 lint 스크립트는 --fix가 붙어 있어 자동 수정 후 통과해버린다.
      # CI에서는 수정하지 않고 위반을 그대로 실패시켜야 하므로 eslint를 직접 호출한다.
      - name: Lint
        run: pnpm --filter @planit/backend exec eslint "{src,adapters,apps,libs,test}/**/*.ts"

      - name: Build
        run: pnpm --filter @planit/backend run build

      - name: Test
        run: pnpm --filter @planit/backend test

  mobile:
    name: Mobile (lint / typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          # apps/mobile/package.json의 engines가 >= 22.11.0을 요구한다(RN 0.86).
          # 백엔드 잡(24)과 다른 건 의도적이다 — 앱은 배포 런타임이 없으니
          # 선언한 지원 하한에서 돌려, 하한을 넘는 API 사용을 잡는다.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 백엔드와 달리 스크립트를 그대로 부른다. 모바일 lint는 `eslint .`라
      # --fix가 없어서, 로컬과 CI가 같은 명령으로 같은 결과를 낸다.
      - name: Lint
        run: pnpm --filter @planit/mobile lint

      - name: Typecheck
        run: pnpm --filter @planit/mobile typecheck

      - name: Test
        run: pnpm --filter @planit/mobile test
