name: TourAPI Batch Pipeline

on:
  schedule:
    - cron: "0 18 * * *" # TODO: 최종 스케줄 확정 (현재는 KST 다음날 03:00)
  workflow_dispatch:
    inputs:
      region_code:
        description: "수동 실행 시 대상 지역"
        required: false
        type: choice
        default: ALL
        options: [ALL, SEOUL, BUSAN, JEJU]

jobs:
  # 실행할 지역 목록을 만든다. matrix를 하드코딩하면 workflow_dispatch의
  # region_code 입력이 조용히 무시되므로(실제로 그랬다) 여기서 계산해 넘긴다.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.resolve.outputs.regions }}
    steps:
      - id: resolve
        # schedule 트리거에서는 inputs가 비어 있어 자동으로 전체 지역이 된다.
        env:
          REGION_CODE: ${{ inputs.region_code }}
        run: |
          if [ -z "$REGION_CODE" ] || [ "$REGION_CODE" = "ALL" ]; then
            regions='["SEOUL","BUSAN","JEJU"]'
          else
            regions="[\"$REGION_CODE\"]"
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "대상 지역 $regions"

  run-batch:
    needs: prepare
    runs-on: ubuntu-latest
    # 러너가 멈춰도 기본 6시간을 붙들고 있지 않도록 상한을 둔다.
    # 정상 실행은 40초, 전부 실패해도 아래 재시도 정책상 3분을 넘지 않는다.
    timeout-minutes: 10
    strategy:
      # 지역을 순차 실행한다. 병렬로 돌리면 3개 job이 apis.data.go.kr를 동시에 호출해
      # connect timeout으로 실패한 적이 있다(2026-08-27 run 33067133732: SEOUL 실패).
      max-parallel: 1
      # 한 지역이 실패해도 나머지 지역은 계속 수집한다.
      # (위 실패 때 fail-fast 기본값 때문에 JEJU가 통째로 취소됐다.)
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.prepare.outputs.regions) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          # CI의 백엔드 잡과 같은 24를 쓴다. 배치는 백엔드 코드를 그대로 실행하고
          # Vercel 운영도 24.x다. 20에서는 @supabase/supabase-js가 지원 중단 경고를 냈다.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apis.data.go.kr 접속이 해외 러너에서 끊기는 일이 반복된다. 클라이언트 자체
      # 백오프(4회, ~45초)를 잡 레벨에서 한 번 더 감싼다. 배치는 upsert 기반이라
      # 중복 실행해도 안전하다.
      #
      # 재시도 창을 5회 x 300초(=25분)에서 2회 x 60초로 줄인 이유:
      #
      #   2026-08-30 run 33333424521의 BUSAN 잡을 보면, 25분에 걸친 20번의 HTTP
      #   시도가 전부 첫 호출에서 connect timeout으로 실패했다. 그런데 바로 다음
      #   순서인 JEJU/SEOUL 잡은 다른 러너에서 36초 만에 성공했다.
      #   즉 장애는 apis.data.go.kr 쪽이 아니라 그 러너에서 못 닿는 것이고,
      #   같은 러너에서 기다리는 것으로는 회복되지 않는다.
      #   25분 중 21분이 순수 sleep이었고, 그 시간이 그대로 과금됐다.
      #
      #   실패한 지역은 다음 크론(하루 뒤)이 upsert로 따라잡는다. 관광 데이터는
      #   하루 지연이 문제되지 않는다 - 실측상 8개월에 38%만 수정된다.
      #   러너 시간을 25분씩 태우는 쪽이 훨씬 비싸다(비공개 저장소 Free = 월 2,000분).
      - name: Run batch pipeline
        env:
          REGION: ${{ matrix.region }}
          MAX_ATTEMPTS: "2"
          RETRY_DELAY_SECONDS: "60"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if pnpm --filter @planit/backend batch:run "$REGION"; then
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "[batch] $REGION attempt $attempt/$MAX_ATTEMPTS failed, retrying in ${RETRY_DELAY_SECONDS}s"
              sleep "$RETRY_DELAY_SECONDS"
            fi
            attempt=$((attempt + 1))
          done
          echo "[batch] $REGION failed after $MAX_ATTEMPTS attempts"
          exit 1
