name: TourAPI Batch Pipeline

on:
  schedule:
    - cron: "0 18 * * *" # TODO: 최종 스케줄 확정 (현재는 KST 다음날 03:00)
  workflow_dispatch:
    inputs:
      region_code:
        description: "수동 실행 시 단일 지역만 (SEOUL|BUSAN|JEJU). 비우면 전체 지역 실행"
        required: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    strategy:
      # 지역을 순차 실행한다. 병렬로 돌리면 3개 job이 apis.data.go.kr를 동시에 호출해
      # connect timeout으로 실패한 적이 있다(2026-08-27 run 33067133732: SEOUL 실패).
      max-parallel: 1
      # 한 지역이 실패해도 나머지 지역은 계속 수집한다.
      # (위 실패 때 fail-fast 기본값 때문에 JEJU가 통째로 취소됐다.)
      fail-fast: false
      matrix:
        region: [SEOUL, BUSAN, JEJU]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apis.data.go.kr 접속이 해외 러너에서 수 분 단위로 끊기는 일이 있다
      # (2026-08-28 run 33134494767: BUSAN이 01:59, 02:04 두 번 ConnectTimeoutError로
      #  실패하고 02:07 재실행에서 성공 = 약 7분 장애).
      # 클라이언트 자체 백오프(4회, ~53초)로는 이 길이를 못 넘기므로 잡 레벨에서 한 번 더 감싼다.
      # 배치는 upsert 기반이라 중복 실행해도 안전하다.
      - name: Run batch pipeline
        env:
          REGION: ${{ matrix.region }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @planit/backend batch:run "$REGION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "[batch] $REGION attempt $attempt failed, retrying in 180s"
              sleep 180
            fi
          done
          echo "[batch] $REGION failed after 3 attempts"
          exit 1
