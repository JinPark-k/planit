name: TourAPI Batch Pipeline

on:
  schedule:
    - cron: "0 18 * * *" # TODO: 최종 스케줄 확정 (현재는 KST 다음날 03:00)
  workflow_dispatch:
    inputs:
      region_code:
        description: "수동 실행 시 단일 지역만 (SEOUL|BUSAN|JEJU). 비우면 전체 지역 실행"
        required: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    strategy:
      # 지역을 순차 실행한다. 병렬로 돌리면 3개 job이 apis.data.go.kr를 동시에 호출해
      # connect timeout으로 실패한 적이 있다(2026-08-27 run 33067133732: SEOUL 실패).
      max-parallel: 1
      # 한 지역이 실패해도 나머지 지역은 계속 수집한다.
      # (위 실패 때 fail-fast 기본값 때문에 JEJU가 통째로 취소됐다.)
      fail-fast: false
      matrix:
        region: [SEOUL, BUSAN, JEJU]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run batch pipeline
        run: pnpm --filter @planit/backend batch:run ${{ matrix.region }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
